<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homem de Presença</title>
<style>
  :root{
    --bg:#0a0c10;
    --bg2:#0d1015;
    --line:#eef1f5;
    --line-dim:#5a6472;
    /* Mantendo a sua paleta original avermelhada elegante */
    --gold:#9D111B;
    --gold-dim:#790D15;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:'Helvetica Neue',Arial,sans-serif;
    overflow-x:hidden;
  }
  body.lock{ overflow:hidden; height:100vh; }

  /* ---------- INTRO OVERLAY ---------- */
  #intro-overlay{
    position:fixed; inset:0; z-index:9999;
    background: radial-gradient(ellipse at 50% 40%, #12151b 0%, #0a0c10 70%);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.9s ease;
  }
  #intro-overlay.fade-out{ opacity:0; pointer-events:none; }

  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-dim) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.06;
    animation:gridpan 30s linear infinite;
  }
  @keyframes gridpan{
    from{ background-position:0 0,0 0; }
    to{ background-position:400px 0, 0 400px; }
  }

  .intro-stage{
    position:relative;
    width:min(80vw,420px);
    aspect-ratio: 400/460;
    perspective:900px;
  }

  /* corner HUD brackets */
  .bracket{ position:absolute; width:22px; height:22px; border-color:var(--gold-dim); opacity:0.6; }
  .bracket.tl{ top:-14px; left:-14px; border-top:1.5px solid; border-left:1.5px solid; }
  .bracket.tr{ top:-14px; right:-14px; border-top:1.5px solid; border-right:1.5px solid; }
  .bracket.bl{ bottom:-14px; left:-14px; border-bottom:1.5px solid; border-left:1.5px solid; }
  .bracket.br{ bottom:-14px; right:-14px; border-bottom:1.5px solid; border-right:1.5px solid; }

  .hud-label{
    position:absolute; left:-10px; top:-34px;
    font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:2px; color:var(--gold-dim);
    opacity:0; white-space:nowrap;
  }
  .hud-label.show{ animation:hudflicker 0.4s ease forwards; }
  @keyframes hudflicker{ 0%{opacity:0;} 40%{opacity:1;} 60%{opacity:0.3;} 100%{opacity:0.85;} }

  .hud-pct{
    position:absolute; right:-6px; bottom:-30px;
    font-family:'Courier New',monospace; font-size:11px;
    letter-spacing:1px; color:var(--gold-dim); opacity:0;
  }
  .hud-pct.show{ opacity:0.85; }

  #suit-svg{
    width:100%; height:100%; display:block;
    transform-style:preserve-3d;
    animation:spinIn 1s cubic-bezier(.22,.75,.32,1) both;
    filter: drop-shadow(0 0 10px rgba(157, 17, 27, 0.1));
  }
  @keyframes spinIn{
    0%{ transform:rotateY(-30deg) scale(.88); opacity:0; filter:blur(10px); }
    100%{ transform:rotateY(0deg) scale(1); opacity:1; filter:blur(0px); }
  }

  .draw{
    fill:none;
    stroke:var(--line);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1), opacity 0.6s ease;
  }
  .draw.gold{ stroke:var(--gold); }
  .draw.dim{ stroke:var(--line-dim); stroke-width:1.2; }
  
  /* The hidden H bars */
  .h-shape { stroke-width: 2.5; opacity: 0; }
  .h-shape.show { opacity: 1; }

  #hBarL, #hBarR{ transition: transform 0.8s cubic-bezier(.4,0,.2,1), opacity 0.6s ease; }
  #hBarL.split{ transform:translateX(-90px); }
  #hBarR.split{ transform:translateX(90px); }
  #crossbar.hide{ opacity:0; }

  #text-reveal{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; pointer-events:none;
  }
  .reveal-text{
    opacity:0; transform:scale(0.82);
    transition:opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1);
    color:#f2f2f2; font-family:Georgia,'Times New Roman',serif;
    letter-spacing:0.14em; font-size:clamp(18px,4.6vw,26px);
    text-align:center; white-space:nowrap;
  }
  .reveal-text.show{ opacity:1; transform:scale(1); }
  .reveal-text .big-h{
    color:var(--gold); font-size:1.55em; font-weight:700;
    letter-spacing:0;
  }
  .reveal-rule{
    width:0; height:1px; background:var(--gold-dim); margin-top:14px;
    transition:width 1s ease 0.15s;
  }
  .reveal-rule.show{ width:120px; }

  .skip-btn{
    position:absolute; bottom:18px; right:18px;
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:1px;
    color:var(--line-dim); background:none; border:1px solid var(--line-dim);
    padding:6px 12px; cursor:pointer; opacity:0; transition:opacity .5s ease, color .3s, border-color .3s;
    z-index:2;
  }
  .skip-btn.show{ opacity:0.7; }
  .skip-btn:hover{ color:var(--gold); border-color:var(--gold-dim); opacity:1; }

  /* ---------- SITE CONTENT ---------- */
  #site-content{ background:var(--bg2); min-height:100vh; color:#e8e8e8; }
  header.site-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:28px 6vw; border-bottom:1px solid #1c2028;
  }
  .logo{ font-family:Georgia,serif; letter-spacing:0.12em; font-size:18px; }
  .logo .g{ color:var(--gold); }
  nav.links a{
    color:#c7cbd1; text-decoration:none; margin-left:32px; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase; opacity:0.85;
  }
  nav.links a:hover{ color:var(--gold); }
  .hero{
    max-width:720px; margin:14vh auto 0; padding:0 6vw; text-align:center;
  }
  .hero h1{
    font-family:Georgia,serif; font-weight:400; font-size:clamp(30px,5vw,50px);
    line-height:1.25; letter-spacing:0.02em; margin-bottom:22px;
  }
  .hero h1 span{ color:var(--gold); }
  .hero p{ color:#a7adb6; font-size:15px; line-height:1.7; margin-bottom:34px; }
  .cta{
    display:inline-block; padding:14px 34px; border:1px solid var(--gold);
    color:var(--gold); text-decoration:none; letter-spacing:0.1em; font-size:13px;
    text-transform:uppercase; transition:all .3s ease;
  }
  .cta:hover{ background:var(--gold); color:#0a0c10; }
</style>
</head>
<body class="lock">

<div id="intro-overlay">
  <div class="grid-bg"></div>

  <div class="intro-stage">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>
    <span class="hud-label" id="hudLabel">RENDERIZANDO_ALFAIATARIA</span>
    <span class="hud-pct" id="hudPct">00%</span>

    <svg id="suit-svg" viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
      
      <!-- ================= DETALHES INTERNOS (Costuras, Cinto) ================= -->
      <g class="suit-part">
        <!-- Pences (Costuras frontais para caimento Slim) -->
        <path class="draw dim" d="M145,190 Q150,260 145,350"/>
        <path class="draw dim" d="M255,190 Q250,260 255,350"/>
        
        <!-- Cinto e Fivela (Visto pois o terno está aberto) -->
        <path class="draw dim" d="M168,325 L232,325"/>
        <path class="draw dim" d="M168,338 L232,338"/>
        <rect class="draw gold" x="190" y="321" width="20" height="21" rx="2"/>
        
        <!-- Gola da Camisa -->
        <path class="draw" d="M175,65 L200,90 L225,65"/>
      </g>

      <!-- ================= ESTRUTURA DO TERNO ================= -->
      <g class="suit-part">
        <!-- Ombros e Silhueta Externa (Cintura afunilada) -->
        <path class="draw" id="outlineL" d="M 180,60 L 140,65 L 100,85 C 110,160 120,260 115,410"/>
        <path class="draw" id="outlineR" d="M 220,60 L 260,65 L 300,85 C 290,160 280,260 285,410"/>

        <!-- Linha Interna do Braço -->
        <path class="draw" d="M 115,145 C 105,250 90,390 90,410"/>
        <path class="draw" d="M 285,145 C 295,250 310,390 310,410"/>

        <!-- Bordas Internas do Blazer (Retas, indicando que está aberto) -->
        <path class="draw" d="M 170,70 L 165,240 L 168,410"/>
        <path class="draw" d="M 230,70 L 235,240 L 232,410"/>

        <!-- Peak Lapels (Lapelas pontudas e anguladas) -->
        <path class="draw" d="M 170,70 L 145,155 L 115,140 L 165,240"/>
        <path class="draw" d="M 230,70 L 255,155 L 285,140 L 235,240"/>
        
        <!-- Bainha Inferior -->
        <path class="draw" d="M 115,410 L 168,410"/>
        <path class="draw" d="M 285,410 L 232,410"/>
      </g>

      <!-- ================= ACESSÓRIOS (Gravata, Bolsos) ================= -->
      <g class="suit-part">
        <!-- Gravata Slim -->
        <path class="draw gold" d="M 193,90 L 207,90 L 205,105 L 195,105 Z"/>
        <path class="draw gold" d="M 195,105 L 205,105 L 209,290 L 200,315 L 191,290 Z"/>

        <!-- Bolso do Peito com Lenço (Pocket Square) -->
        <path class="draw dim" d="M 125,170 L 150,165"/>
        <path class="draw gold" d="M 130,168 L 135,152 L 142,165"/>

        <!-- Bolsos com Aba na Cintura -->
        <path class="draw dim" d="M 118,290 L 155,295 L 155,305 L 115,300 Z"/>
        <path class="draw dim" d="M 282,290 L 245,295 L 245,305 L 285,300 Z"/>
      </g>

      <!-- ================= O MONOGRAMA "H" ================= -->
      <!-- Estas linhas nascem após o terno desaparecer -->
      <path class="draw h-shape gold" id="hBarL" d="M 165,100 L 165,360"/>
      <path class="draw h-shape gold" id="hBarR" d="M 235,100 L 235,360"/>
      <path class="draw h-shape gold" id="crossbar" d="M 165,230 L 235,230"/>
    </svg>

    <div id="text-reveal">
      <div class="reveal-text" id="revealText"><span class="big-h">H</span>OMEM DE PRESEN&Ccedil;A</div>
      <div class="reveal-rule" id="revealRule"></div>
    </div>
  </div>

  <button class="skip-btn" id="skipBtn">PULAR ›</button>
</div>

<!-- ================= CONTEÚDO DO SITE ================= -->
<div id="site-content">
  <header class="site-nav">
    <div class="logo">HOMEM DE <span class="g">PRESEN&Ccedil;A</span></div>
    <nav class="links">
      <a href="#">Sobre</a>
      <a href="#">Estilo</a>
      <a href="#">Contato</a>
    </nav>
  </header>
  <section class="hero">
    <h1>A eleg&acirc;ncia est&aacute; <br>nos <span>detalhes</span>.</h1>
    <p>Um guia direto sobre postura, estilo e atitude para o homem que quer ser lembrado
       antes mesmo de dizer uma palavra.</p>
    <a class="cta" href="#">Descubra</a>
  </section>
</div>

<script>
(function(){
  var timers = [];
  function schedule(fn, t){ timers.push(setTimeout(fn, t)); }

  // Configuração inicial dos SVGs
  function setupDraw(el){
    var len = el.getTotalLength ? el.getTotalLength() : 400;
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  }
  function trigger(el){ el.style.strokeDashoffset = 0; }

  var drawEls = Array.prototype.slice.call(document.querySelectorAll('.draw'));
  drawEls.forEach(setupDraw);

  var suitParts = Array.prototype.slice.call(document.querySelectorAll('.suit-part'));
  var allPaths = Array.prototype.slice.call(document.querySelectorAll('.suit-part .draw'));
  
  var hBarL = document.getElementById('hBarL'),
      hBarR = document.getElementById('hBarR'),
      crossbar = document.getElementById('crossbar'),
      hudLabel = document.getElementById('hudLabel'),
      hudPct = document.getElementById('hudPct'),
      revealText = document.getElementById('revealText'),
      revealRule = document.getElementById('revealRule'),
      overlay = document.getElementById('intro-overlay'),
      skipBtn = document.getElementById('skipBtn');

  // Contador do HUD
  var pctInterval = null;
  function startPct(totalMs){
    var start = Date.now();
    hudPct.classList.add('show');
    hudLabel.classList.add('show');
    pctInterval = setInterval(function(){
      var pct = Math.min(100, Math.round((Date.now()-start)/totalMs*100));
      hudPct.textContent = (pct<10?'0':'')+pct+'%';
      if(pct>=100) {
        clearInterval(pctInterval);
        hudLabel.textContent = "ALFAIATARIA_CONCLUIDA";
      }
    }, 40);
  }
  function stopPct(){ if(pctInterval) clearInterval(pctInterval); hudPct.textContent='100%'; }

  function fadeSuit(){
    // Esmaece todo o terno para dar lugar ao 'H'
    suitParts.forEach(function(g){ 
      g.style.transition = "opacity 0.8s ease";
      g.style.opacity = 0; 
    });
    hudLabel.style.opacity = 0; 
    hudPct.style.opacity = 0;
  }

  function drawH(){
    hBarL.classList.add('show');
    hBarR.classList.add('show');
    crossbar.classList.add('show');
    
    trigger(hBarL); trigger(hBarR);
    schedule(function(){ trigger(crossbar); }, 400);
  }

  function splitH(){
    hBarL.classList.add('split');
    hBarR.classList.add('split');
    crossbar.classList.add('hide');
  }

  function showText(){
    revealText.classList.add('show');
    schedule(function(){ revealRule.classList.add('show'); }, 100);
  }

  function fadeOutOverlay(){
    overlay.classList.add('fade-out');
    document.body.classList.remove('lock');
    setTimeout(function(){ overlay.style.display = 'none'; }, 950);
  }

  function skip(){
    timers.forEach(clearTimeout);
    if(pctInterval) clearInterval(pctInterval);
    fadeOutOverlay();
  }
  skipBtn.addEventListener('click', skip);

  // ---------------- TIMELINE DE ANIMAÇÃO ----------------
  
  // 1. Desenha as linhas mestras (Ombros, braços, blazer aberto)
  schedule(function(){ 
    allPaths.forEach(function(p, i) {
      // Cria um efeito em cascata sutil para o desenho
      setTimeout(function(){ trigger(p); }, i * 60);
    });
  }, 400);

  // Inicia a porcentagem
  schedule(function(){ startPct(2600); }, 0);
  schedule(function(){ skipBtn.classList.add('show'); }, 1000);

  // 2. Apaga o terno e inicia a metamorfose para o H
  schedule(function(){ fadeSuit(); stopPct(); }, 3000);
  
  // 3. Desenha o "H"
  schedule(function(){ drawH(); }, 3300);

  // 4. Separa as barras do H para revelar o texto
  schedule(function(){ splitH(); }, 4700);
  schedule(function(){ showText(); }, 4900);

  // 5. Finaliza a introdução
  schedule(function(){ fadeOutOverlay(); }, 6800);
})();
</script>
</body>
</html>
