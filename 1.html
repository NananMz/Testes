<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homem de Presença - Intro</title>
<style>
  :root {
    --bg: #060709;
    --gold: #D4AF37;
    --gold-light: #FFF0A5;
    --gold-dark: #8C6D23;
    --line: #E2E8F0;
    --line-dim: rgba(226, 232, 240, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Cinzel', Georgia, serif;
  }

  /* ---------- STAGE & BACKGROUND ---------- */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: 
      radial-gradient(circle at 50% 45%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
      radial-gradient(circle at 50% 50%, #0d0f14 0%, #040507 100%);
  }

  /* Dust Particles / Ambient Glow */
  .ambient-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: var(--gold);
    filter: blur(140px);
    opacity: 0.12;
    border-radius: 50%;
    animation: pulseGlow 4s ease-in-out infinite alternate;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.8); opacity: 0.08; }
    100% { transform: scale(1.2); opacity: 0.18; }
  }

  /* HUD Minimalista */
  .hud-tracker {
    position: absolute;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    opacity: 0.5;
    text-transform: uppercase;
  }
  .hud-tl { top: 40px; left: 40px; border-left: 1px solid var(--gold); padding-left: 8px; }
  .hud-br { bottom: 40px; right: 40px; border-right: 1px solid var(--gold); padding-right: 8px; }

  /* Scanline Vertical */
  .scanline {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    z-index: 10;
  }

  /* ---------- SVG CONTAINER ---------- */
  .svg-container {
    width: min(85vw, 420px);
    height: auto;
    aspect-ratio: 1 / 1;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.15));
  }

  svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* Elementos de Desenho */
  .stroke-draw {
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .silver { stroke: var(--line); }
  .gold { stroke: var(--gold); }
  
  /* Transições de Estado dos Elementos */
  .fade-out { opacity: 0 !important; transform: scale(0.95); }
  .gold-fill { fill: var(--gold) !important; }

  /* ---------- TEXT REVEAL ---------- */
  .brand-reveal {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 5;
    pointer-events: none;
  }

  .brand-reveal.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .brand-title {
    color: #ffffff;
    font-size: clamp(20px, 5vw, 32px);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-weight: 300;
    text-align: center;
    text-shadow: 0 0 20px rgba(0,0,0,0.8);
  }

  .brand-title span {
    color: var(--gold);
    font-weight: 600;
  }

  .brand-subtitle {
    margin-top: 12px;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 10px;
    letter-spacing: 0.5em;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
  }

  .gold-line {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-top: 18px;
    transition: width 1.2s ease 0.3s;
  }

  .brand-reveal.active .gold-line {
    width: 140px;
  }

  /* Botão de Pular */
  .skip-btn {
    position: absolute;
    bottom: 30px;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.3s;
    z-index: 20;
  }
  .skip-btn:hover { color: var(--gold); }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="stage">
  <div class="ambient-glow"></div>
  <div class="scanline" id="scanline"></div>

  <!-- HUD Overlay -->
  <div class="hud-tracker hud-tl">SYS.PRESENCE // v2.0</div>
  <div class="hud-tracker hud-br" id="hudStat">STATUS: INICIALIZANDO</div>

  <!-- Palco SVG -->
  <div class="svg-container">
    <svg viewBox="0 0 400 400" id="mainSvg">
      <defs>
        <!-- Gradiente Dourado para Elementos Nobres -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFF0A5" />
          <stop offset="50%" stop-color="#D4AF37" />
          <stop offset="100%" stop-color="#8C6D23" />
        </linearGradient>
      </defs>

      <!-- ================= TERNO (ESTRUTURA) ================= -->
      <g id="suitGroup">
        <!-- Contorno dos Ombros e Braços -->
        <path class="stroke-draw silver" id="shoulders" d="M 80,140 L 140,80 L 260,80 L 320,140 L 300,340 L 100,340 Z" />
        
        <!-- Camisa (V Interno) -->
        <path class="stroke-draw silver" id="shirt" d="M 170,80 L 200,160 L 230,80" opacity="0.4" />
        
        <!-- Lapela Esquerda (Peak Lapel) -->
        <path class="stroke-draw silver" id="lapelL" d="M 140,80 L 175,170 L 125,185 L 185,270 L 185,340" />
        
        <!-- Lapela Direita (Peak Lapel) -->
        <path class="stroke-draw silver" id="lapelR" d="M 260,80 L 225,170 L 275,185 L 215,270 L 215,340" />

        <!-- Gravata (Destaque em Ouro) -->
        <path class="stroke-draw gold" id="tie" d="M 192,120 L 208,120 L 214,240 L 200,265 L 186,240 Z" />
        
        <!-- Botão do Terno -->
        <circle cx="200" cy="280" r="3" class="stroke-draw gold" id="button" opacity="0" />
      </g>

      <!-- ================= MONOGRAMA 'H' (FORMADO NA METAMORFOSE) ================= -->
      <g id="hGroup" opacity="0">
        <!-- H - Haste Esquerda -->
        <path class="stroke-draw gold" id="hLeft" d="M 140,100 L 140,300" stroke-width="3" />
        <!-- H - Haste Direita -->
        <path class="stroke-draw gold" id="hRight" d="M 260,100 L 260,300" stroke-width="3" />
        <!-- H - Barra Central -->
        <path class="stroke-draw gold" id="hCross" d="M 140,200 L 260,200" stroke-width="3" />
      </g>
    </svg>
  </div>

  <!-- Revelação da Marca -->
  <div class="brand-reveal" id="brandReveal">
    <div class="brand-title">HOMEM DE <span>PRESENÇA</span></div>
    <div class="brand-subtitle">Elegância • Postura • Poder</div>
    <div class="gold-line"></div>
  </div>

  <button class="skip-btn" onclick="finishAnimation()">[ REPETIR ANIMAÇÃO ]</button>
</div>

<script>
  // Utilitário de preparação de paths
  function initPath(el) {
    const length = el.getTotalLength();
    el.style.strokeDasharray = length;
    el.style.strokeDashoffset = length;
    return length;
  }

  // Seleção de elementos
  const paths = {
    shoulders: document.getElementById('shoulders'),
    shirt: document.getElementById('shirt'),
    lapelL: document.getElementById('lapelL'),
    lapelR: document.getElementById('lapelR'),
    tie: document.getElementById('tie'),
    button: document.getElementById('button'),
    hLeft: document.getElementById('hLeft'),
    hRight: document.getElementById('hRight'),
    hCross: document.getElementById('hCross')
  };

  const suitGroup = document.getElementById('suitGroup');
  const hGroup = document.getElementById('hGroup');
  const brandReveal = document.getElementById('brandReveal');
  const hudStat = document.getElementById('hudStat');
  const scanline = document.getElementById('scanline');

  // Inicializa todos os caminhos como invisíveis
  Object.values(paths).forEach(p => { if(p.getTotalLength) initPath(p); });

  function drawPath(el, duration, delay = 0) {
    setTimeout(() => {
      el.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s`;
      el.style.strokeDashoffset = '0';
    }, delay);
  }

  function runSequence() {
    // RESET
    suitGroup.classList.remove('fade-out');
    hGroup.style.opacity = '0';
    brandReveal.classList.remove('active');
    
    Object.values(paths).forEach(p => { 
      if(p.getTotalLength) {
        p.style.transition = 'none';
        p.style.strokeDashoffset = p.getTotalLength();
      }
    });

    // ATO 1: O DESENHO DO TERNO (0s - 2.5s)
    hudStat.innerText = "STATUS: ESCULPINDO SILHUETA";
    
    // Animação da Scanline
    scanline.style.transition = 'none';
    scanline.style.top = '0%';
    scanline.style.opacity = '0.8';
    setTimeout(() => {
      scanline.style.transition = 'top 2.5s linear, opacity 0.3s';
      scanline.style.top = '100%';
    }, 50);

    drawPath(paths.shoulders, 1200, 200);
    drawPath(paths.shirt, 800, 600);
    drawPath(paths.lapelL, 1000, 900);
    drawPath(paths.lapelR, 1000, 900);
    drawPath(paths.tie, 900, 1400);
    
    setTimeout(() => {
      paths.button.style.transition = 'opacity 0.4s';
      paths.button.style.opacity = '1';
    }, 2000);

    // ATO 2: A METAMORFOSE PARA O 'H' (2.8s - 4.5s)
    setTimeout(() => {
      hudStat.innerText = "STATUS: SINTETIZANDO MONOGRAMA";
      
      // Suaviza e esconde o terno
      suitGroup.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
      suitGroup.classList.add('fade-out');

      // Revela o Grupo 'H'
      hGroup.style.transition = 'opacity 0.5s';
      hGroup.style.opacity = '1';

      // Desenha o 'H' com força
      drawPath(paths.hLeft, 800, 200);
      drawPath(paths.hRight, 800, 200);
      drawPath(paths.hCross, 600, 700);
    }, 2800);

    // ATO 3: A REVELAÇÃO DA MARCA (4.8s+)
    setTimeout(() => {
      hudStat.innerText = "STATUS: PRESENÇA CONFIRMADA";
      
      // O 'H' encolhe ligeiramente e sobe para dar espaço ao texto
      hGroup.style.transition = 'transform 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
      hGroup.style.transformOrigin = 'center';
      hGroup.style.transform = 'translateY(-40px) scale(0.65)';

      // Ativa o texto final
      brandReveal.classList.add('active');
    }, 4600);
  }

  function finishAnimation() {
    runSequence();
  }

  // Iniciar automaticamente
  window.onload = runSequence;
</script>
</body>
</html>
