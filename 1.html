<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homem de Presença - Animação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Variáveis do Tema Principal */
    --bg-deep: #050505;
    --bg-card: #0a0a0a;
    --red-main: #C1121F;
    --red-dusk: #8A1018;
    --red-glow: #E63946;
    --white-main: #F5F5F5;
    --white-sec: #A3A3A3;
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-deep);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  body.lock { overflow: hidden; height: 100vh; }

  /* ---------- INTRO OVERLAY ---------- */
  #intro-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background-color: var(--bg-deep);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease;
  }
  #intro-overlay.fade-out { opacity: 0; pointer-events: none; }

  /* BACKGROUND VIVO DA REFERÊNCIA */
  .ambient-bg {
    position: absolute; inset: 0; z-index: -3; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #110507 0%, var(--bg-deep) 80%);
  }
  .ambient-glow {
    position: absolute; top: -10%; left: 50%;
    width: 150vw; height: 60vh;
    background: radial-gradient(circle, rgba(193, 18, 31, 0.12) 0%, transparent 60%);
    transform: translateX(-50%);
    animation: drift 15s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { transform: translate(-50%, 0) scale(1); }
    100% { transform: translate(-48%, 5%) scale(1.15); }
  }
  .cinematic-grain {
    position: absolute; inset: 0; z-index: -2; opacity: 0.05; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  .intro-stage {
    position: relative;
    width: min(80vw, 380px);
    aspect-ratio: 400/420;
    perspective: 900px;
  }

  /* Corner HUD brackets */
  .bracket { 
    position: absolute; width: 22px; height: 22px; 
    border-color: var(--red-main); opacity: 0.7; 
    filter: drop-shadow(0 0 4px var(--red-main)); 
  }
  .bracket.tl { top: -14px; left: -14px; border-top: 1.5px solid; border-left: 1.5px solid; }
  .bracket.tr { top: -14px; right: -14px; border-top: 1.5px solid; border-right: 1.5px solid; }
  .bracket.bl { bottom: -14px; left: -14px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
  .bracket.br { bottom: -14px; right: -14px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

  /* Tipografia do HUD */
  .hud-label, .hud-pct {
    font-family: var(--font-body);
    color: var(--red-main);
    text-shadow: 0 0 8px rgba(193, 18, 31, 0.6);
    font-weight: 500;
  }
  .hud-label {
    position: absolute; left: -10px; top: -34px;
    font-size: 11px; letter-spacing: 3px;
    opacity: 0; white-space: nowrap;
  }
  .hud-label.show { animation: hudflicker 0.4s ease forwards; }
  @keyframes hudflicker { 0%{opacity:0;} 40%{opacity:1;} 60%{opacity:0.3;} 100%{opacity:0.85;} }

  .hud-pct {
    position: absolute; right: -6px; bottom: -30px;
    font-size: 13px; letter-spacing: 2px; opacity: 0;
  }
  .hud-pct.show { opacity: 0.85; }

  #suit-svg {
    width: 100%; height: 100%; display: block;
    transform-style: preserve-3d;
    animation: spinIn 0.85s cubic-bezier(.22,.75,.32,1) both;
  }
  @keyframes spinIn {
    0% { transform: rotateY(0deg) scale(.88); opacity: 0; }
    55% { opacity: 1; }
    100% { transform: rotateY(360deg) scale(1); opacity: 1; }
  }

  /* Estilo Elegante do Terno Motion Graphic */
  .draw {
    fill: none;
    stroke: rgba(245, 245, 245, 0.5); /* Branco translúcido para linhas de fora */
    stroke-width: 2.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke-dashoffset 0.85s cubic-bezier(.4,0,.2,1), opacity 1.5s ease; /* Fade-out mais longo e suave */
  }
  .draw.red {
    stroke: var(--red-main);
    filter: drop-shadow(0 0 6px rgba(193,18,31,0.6));
    opacity: 1;
  }
  .draw.red.stroke-glow {
    stroke-width: 2.8;
    filter: drop-shadow(0 0 12px rgba(193,18,31,0.9));
  }

  .btn {
    fill: none; stroke: rgba(245, 245, 245, 0.5); stroke-width: 1.4;
    opacity: 0; transition: opacity 1.5s ease;
  }
  .btn.show { opacity: 0.9; }

  /* Animação Suave das Barras do H */
  #hBarL, #hBarR { transition: transform 1.2s cubic-bezier(.4,0,.2,1); }
  #hBarL.split { transform: translateX(-140px); }
  #hBarR.split { transform: translateX(140px); }
  #crossbar { transition: opacity 0.6s ease, stroke-dashoffset 0.85s cubic-bezier(.4,0,.2,1); }
  #crossbar.hide { opacity: 0 !important; }

  #text-reveal {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; pointer-events: none;
  }
  
  /* Text Reveal utilizando as fontes do HTML Principal */
  .reveal-text {
    opacity: 0; transform: scale(0.85);
    transition: opacity 1.2s cubic-bezier(.2,.8,.2,1), transform 1.2s cubic-bezier(.2,.8,.2,1);
    font-family: var(--font-heading);
    letter-spacing: 2px; font-size: clamp(34px, 6vw, 48px);
    text-align: center; white-space: nowrap;
    color: var(--white-main);
    text-transform: uppercase;
  }
  .reveal-text.show { opacity: 1; transform: scale(1); }
  .reveal-text .red {
    color: var(--red-main); text-shadow: 0 0 20px rgba(193, 18, 31, 0.4);
  }
  .reveal-rule {
    width: 0; height: 1px; 
    background: linear-gradient(90deg, transparent, var(--red-main), transparent); 
    margin-top: 14px;
    transition: width 1.2s cubic-bezier(.2,.8,.2,1) 0.15s;
  }
  .reveal-rule.show { width: 160px; }

  .skip-btn {
    position: absolute; bottom: 18px; right: 18px;
    font-family: var(--font-body); font-size: 11px; letter-spacing: 1px;
    color: var(--white-sec); background: none; border: 1px solid rgba(255,255,255,0.2);
    padding: 6px 12px; cursor: pointer; opacity: 0; transition: opacity .5s ease, color .3s, border-color .3s;
    z-index: 2;
  }
  .skip-btn.show { opacity: 0.7; }
  .skip-btn:hover { color: var(--red-main); border-color: var(--red-main); opacity: 1; }

  /* ---------- SITE CONTENT (behind the intro) ---------- */
  #site-content { background: var(--bg-card); min-height: 100vh; color: var(--white-main); }
  header.site-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 6vw; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .logo { font-family: var(--font-heading); letter-spacing: 1px; font-size: 24px; }
  .logo .g { color: var(--red-main); }
  nav.links a {
    color: var(--white-sec); text-decoration: none; margin-left: 32px; font-size: 13px;
    letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.85; transition: 0.3s;
  }
  nav.links a:hover { color: var(--red-main); }
  .hero {
    max-width: 720px; margin: 14vh auto 0; padding: 0 6vw; text-align: center;
  }
  .hero h1 {
    font-family: var(--font-heading); font-weight: 400; font-size: clamp(40px, 6vw, 60px);
    line-height: 1; letter-spacing: 1px; margin-bottom: 22px; text-transform: uppercase;
  }
  .hero h1 span { color: var(--red-main); text-shadow: 0 0 20px rgba(193, 18, 31, 0.4); }
  .hero p { color: var(--white-sec); font-size: 16px; line-height: 1.7; margin-bottom: 34px; }
  .cta {
    display: inline-block; padding: 14px 34px; border: 1px solid var(--red-main);
    color: var(--white-main); background: linear-gradient(135deg, var(--red-main) 0%, var(--red-dusk) 100%);
    text-decoration: none; letter-spacing: 1px; font-size: 14px; font-weight: 600;
    text-transform: uppercase; transition: all .3s ease; border-radius: 6px;
  }
  .cta:hover { transform: scale(0.97); box-shadow: 0 4px 15px rgba(193, 18, 31, 0.3); }
</style>
</head>
<body class="lock">

<div id="intro-overlay">
  <!-- Fundo Atmosférico -->
  <div class="ambient-bg"><div class="ambient-glow"></div></div>
  <div class="cinematic-grain"></div>

  <div class="intro-stage">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>
    <span class="hud-label" id="hudLabel">RENDERIZANDO_SILHUETA</span>
    <span class="hud-pct" id="hudPct">00%</span>

    <svg id="suit-svg" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <!-- silhouette outline -->
      <path class="draw" id="outlineL" d="M160,58 L82,96 L64,378"/>
      <path class="draw" id="outlineR" d="M240,58 L318,96 L336,378"/>
      <path class="draw" id="hem" d="M64,378 L336,378"/>

      <!-- collar notches -->
      <path class="draw" id="collarL" d="M160,58 L200,42"/>
      <path class="draw" id="collarR" d="M240,58 L200,42"/>

      <!-- lapels (open blazer) -->
      <path class="draw" id="lapelL" d="M160,58 L192,298"/>
      <path class="draw" id="lapelR" d="M240,58 L208,298"/>

      <!-- tie -->
      <path class="draw red" id="tieKnot" d="M188,74 L212,74 L200,98 Z"/>
      <path class="draw red" id="tieStrap" d="M196,98 L190,286 L210,286 L204,98 Z"/>

      <!-- buttons -->
      <circle class="btn" id="btn1" cx="188" cy="318" r="4"/>
      <circle class="btn" id="btn2" cx="188" cy="344" r="4"/>

      <!-- H bars (born from the collar points - Glowing) -->
      <path class="draw red stroke-glow" id="hBarL" d="M160,58 L160,298"/>
      <path class="draw red stroke-glow" id="hBarR" d="M240,58 L240,298"/>
      <path class="draw red stroke-glow" id="crossbar" d="M160,178 L240,178"/>
    </svg>

    <div id="text-reveal">
      <div class="reveal-text" id="revealText"><span class="white">Homem de </span><span class="red">Presença</span></div>
      <div class="reveal-rule" id="revealRule"></div>
    </div>
  </div>

  <button class="skip-btn" id="skipBtn">PULAR ›</button>
</div>

<!-- ================= CONTEÚDO DO SITE ================= -->
<div id="site-content">
  <header class="site-nav">
    <div class="logo">HOMEM DE <span class="g">PRESENÇA</span></div>
    <nav class="links">
      <a href="#">Sobre</a>
      <a href="#">Estilo</a>
      <a href="#">Contato</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Presença não é sorte.<br><span>É construção.</span></h1>
    <p>Um guia direto sobre postura, estilo e atitude para o homem que quer ser lembrado antes mesmo de dizer uma palavra.</p>
    <a class="cta" href="#">Começar a Construir</a>
  </section>
</div>

<script>
(function(){
  var timers = [];
  function schedule(fn, t){ timers.push(setTimeout(fn, t)); }

  function setupDraw(el){
    var len = el.getTotalLength ? el.getTotalLength() : 200;
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  }
  function trigger(el){ el.style.strokeDashoffset = 0; }

  var drawEls = Array.prototype.slice.call(document.querySelectorAll('.draw'));
  drawEls.forEach(setupDraw);

  var outlineL=document.getElementById('outlineL'), outlineR=document.getElementById('outlineR'),
      hem=document.getElementById('hem'), collarL=document.getElementById('collarL'),
      collarR=document.getElementById('collarR'), lapelL=document.getElementById('lapelL'),
      lapelR=document.getElementById('lapelR'), tieKnot=document.getElementById('tieKnot'),
      tieStrap=document.getElementById('tieStrap'), btn1=document.getElementById('btn1'),
      btn2=document.getElementById('btn2'), hBarL=document.getElementById('hBarL'),
      hBarR=document.getElementById('hBarR'), crossbar=document.getElementById('crossbar'),
      hudLabel=document.getElementById('hudLabel'), hudPct=document.getElementById('hudPct'),
      revealText=document.getElementById('revealText'), revealRule=document.getElementById('revealRule'),
      overlay=document.getElementById('intro-overlay'), skipBtn=document.getElementById('skipBtn');

  // H-bars and crossbar removidos da lista de fadeSuit para a transição suave
  var suitParts = [outlineL,outlineR,hem,collarL,collarR,lapelL,lapelR,tieKnot,tieStrap];

  // percentage counter
  var pctInterval = null;
  function startPct(totalMs){
    var start = Date.now();
    hudPct.classList.add('show');
    hudLabel.classList.add('show');
    pctInterval = setInterval(function(){
      var pct = Math.min(100, Math.round((Date.now()-start)/totalMs*100));
      hudPct.textContent = (pct<10?'0':'')+pct+'%';
      if(pct>=100) clearInterval(pctInterval);
    }, 40);
  }
  function stopPct(){ if(pctInterval) clearInterval(pctInterval); hudPct.textContent='100%'; }

  function fadeSuit(){
    // O terno some suavemente usando o novo transition de 1.5s no CSS
    suitParts.forEach(function(el){ el.style.opacity = 0; });
    btn1.classList.remove('show'); btn2.classList.remove('show');
    hudLabel.style.opacity = 0; hudPct.style.opacity = 0;
  }

  function drawH(){
    trigger(hBarL); trigger(hBarR);
    schedule(function(){ trigger(crossbar); }, 350);
  }

  function splitH(){
    hBarL.classList.add('split');
    hBarR.classList.add('split');
    crossbar.classList.add('hide');
  }

  function showText(){
    revealText.classList.add('show');
    schedule(function(){ revealRule.classList.add('show'); }, 100);
  }

  function fadeOutOverlay(){
    overlay.classList.add('fade-out');
    document.body.classList.remove('lock');
    setTimeout(function(){ overlay.style.display = 'none'; }, 1200);
  }

  function skip(){
    timers.forEach(clearTimeout);
    if(pctInterval) clearInterval(pctInterval);
    fadeOutOverlay();
  }
  skipBtn.addEventListener('click', skip);

  // ---------------- NOVA TIMELINE FLUIDA ----------------
  schedule(function(){ trigger(outlineL); trigger(outlineR); }, 450);
  schedule(function(){ trigger(collarL); trigger(collarR); }, 600);
  schedule(function(){ trigger(hem); }, 650);
  schedule(function(){ trigger(lapelL); trigger(lapelR); }, 720);
  schedule(function(){ trigger(tieKnot); }, 880);
  schedule(function(){ trigger(tieStrap); }, 950);
  schedule(function(){ btn1.classList.add('show'); }, 1350);
  schedule(function(){ btn2.classList.add('show'); }, 1450);

  schedule(function(){ startPct(2250); }, 0);
  schedule(function(){ skipBtn.classList.add('show'); }, 900);

  // TRANSFORMAÇÃO SUAVE: O "H" nasce de dentro do terno antes dele sumir
  schedule(function(){ drawH(); }, 2000); 

  // Após o H se desenhar, o restante do terno desaparece em um fade suave
  schedule(function(){ fadeSuit(); stopPct(); }, 2600); 

  // O pilar do H se abre
  schedule(function(){ splitH(); }, 4000); 

  // O texto surge entre as barras
  schedule(function(){ showText(); }, 4200); 

  // Finaliza a introdução
  schedule(function(){ fadeOutOverlay(); }, 6200);
})();
</script>
</body>
</html>
