<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homem de Presença - Intro Motion Graphic</title>
  <style>
    /* =========================================================
       RESET & VARIÁVEIS GLOBAIS
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #0A0C10;
      --accent-gold: #D4AF37;
      --line-white: #E6E8EC;
      --line-dim: rgba(230, 232, 236, 0.2);
      --font-family: 'Cinzel', 'Montserrat', 'Helvetica Neue', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #FFF;
      font-family: var(--font-family);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* =========================================================
       CONTAINER DA INTRO (OVERLAY FULLSCREEN)
       ========================================================= */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-color);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      transition: opacity 1s cubic-bezier(0.77, 0, 0.175, 1), visibility 1s;
    }

    /* Fundo técnico em grade (Grid Pattern) */
    .tech-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 70%),
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
    }

    /* =========================================================
       PALCO DA ANIMAÇÃO MOTION GRAPHIC
       ========================================================= */
    .motion-stage {
      position: relative;
      width: 320px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* SVG do Terno e Letra H */
    .suit-svg {
      width: 240px;
      height: 240px;
      transform-origin: center center;
      animation: spinEntry 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.25));
    }

    /* Configuração padrão de traços técnicos */
    .tech-line {
      fill: none;
      stroke: var(--line-white);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 1.8s cubic-bezier(0.65, 0, 0.35, 1) forwards 0.4s;
    }

    .accent-line {
      stroke: var(--accent-gold);
      stroke-width: 2.5;
    }

    /* Círculo guia técnico ao fundo */
    .guide-circle {
      fill: none;
      stroke: var(--line-dim);
      stroke-width: 1;
      stroke-dasharray: 4 4;
      animation: rotateCircle 20s linear infinite;
      transform-origin: center;
    }

    /* =========================================================
       TEXTO: HOMEM DE PRESENÇA
       ========================================================= */
    .text-container {
      margin-top: 30px;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: revealText 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.2s;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #FFFFFF;
      text-indent: 12px; /* Compensação do letter-spacing */
      background: linear-gradient(135deg, #FFFFFF 0%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      margin-top: 8px;
      font-size: 0.7rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--accent-gold);
      opacity: 0.8;
    }

    /* =========================================================
       KEYFRAMES DA ANIMAÇÃO (MOTION GRAPHICS)
       ========================================================= */
    
    /* 1. Giro 3D e Entrada de Impacto */
    @keyframes spinEntry {
      0% {
        transform: rotateY(-180deg) rotateZ(-45deg) scale(0.3);
        opacity: 0;
      }
      60% {
        transform: rotateY(20deg) rotateZ(5deg) scale(1.05);
        opacity: 1;
      }
      100% {
        transform: rotateY(0deg) rotateZ(0deg) scale(1);
        opacity: 1;
      }
    }

    /* 2. Desenho Vetorial Gradual das Linhas */
    @keyframes drawLine {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* 3. Rotação do círculo de precisão técnico */
    @keyframes rotateCircle {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 4. Aparição do Texto com Expansão de Letras */
    @keyframes revealText {
      0% {
        opacity: 0;
        transform: translateY(25px) scale(0.95);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* 5. Transição do H (Recuo Elegante) */
    .suit-svg.morph-h {
      animation: morphH 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards 1.8s;
    }

    @keyframes morphH {
      0% {
        transform: scale(1) translateY(0);
      }
      100% {
        transform: scale(0.85) translateY(-10px);
      }
    }

    /* =========================================================
       CONTEÚDO PRINCIPAL DO SITE (PÓS-INTRO)
       ========================================================= */
    #main-content {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    body.intro-complete #main-content {
      opacity: 1;
      transform: translateY(0);
    }

    body.intro-complete #intro-overlay {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .btn-replay {
      margin-top: 25px;
      padding: 12px 28px;
      background: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-replay:hover {
      background: var(--accent-gold);
      color: var(--bg-color);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>

  <div id="intro-overlay">
    <div class="tech-grid"></div>

    <div class="motion-stage">
      <svg class="suit-svg morph-h" viewBox="0 0 200 200">
        <circle class="guide-circle" cx="100" cy="100" r="88" />
        <circle class="guide-circle" cx="100" cy="100" r="60" style="animation-duration: 12s; animation-direction: reverse;" />

        <g id="suit-group">
          <path class="tech-line" d="M 55 45 L 55 155 M 55 45 L 80 110 L 55 125" />
          
          <path class="tech-line" d="M 145 45 L 145 155 M 145 45 L 120 110 L 145 125" />

          <path class="tech-line" d="M 75 45 L 100 70 L 125 45" />

          <path class="tech-line accent-line" d="M 55 100 L 145 100" /> <polygon class="tech-line accent-line" points="94,70 106,70 108,80 92,80" /> <path class="tech-line accent-line" d="M 94 80 L 106 80 L 108 135 L 100 145 L 92 135 Z" /> </g>
      </svg>

      <div class="text-container">
        <h1 class="brand-title">Homem de Presença</h1>
        <p class="brand-subtitle">Elegância &amp; Postura</p>
      </div>
    </div>
  </div>

  <main id="main-content">
    <h2 style="font-size: 2.5rem; font-weight: 300; letter-spacing: 4px; margin-bottom: 10px;">BEM-VINDO</h2>
    <p style="color: #A0A5B1; max-width: 500px; line-height: 1.6;">Seu site foi carregado com sucesso após a animação de introdução estilo Motion Graphics.</p>
    <button class="btn-replay" onclick="replayIntro()">Replay Intro</button>
  </main>

  <script>
    // Duração total da intro antes de revelar o site (em milissegundos)
    const INTRO_DURATION = 4200;

    function startIntroTimer() {
      setTimeout(() => {
        document.body.classList.add('intro-complete');
      }, INTRO_DURATION);
    }

    // Inicia o temporizador ao carregar a página
    window.addEventListener('DOMContentLoaded', () => {
      startIntroTimer();
    });

    // Função para reiniciar a animação ao clicar no botão
    function replayIntro() {
      document.body.classList.remove('intro-complete');
      
      // Reinicia os elementos SVG para disparar as animações novamente
      const svg = document.querySelector('.suit-svg');
      const text = document.querySelector('.text-container');
      
      svg.style.animation = 'none';
      text.style.animation = 'none';
      
      // Força o reflow do navegador
      void svg.offsetWidth;
      
      svg.style.animation = '';
      text.style.animation = '';
      
      startIntroTimer();
    }
  </script>
</body>
</html>
