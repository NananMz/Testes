<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homem de Presença</title>
<style>
  :root{
    --bg:#0a0c10;
    --bg2:#0d1015;
    --line:#eef1f5;
    --line-dim:#5a6472;
    --gold:#9D111B;
    --gold-dim:#8a723a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    font-family:'Helvetica Neue',Arial,sans-serif;
    overflow-x:hidden;
  }
  body.lock{ overflow:hidden; height:100vh; }

  /* ---------- INTRO OVERLAY ---------- */
  #intro-overlay{
    position:fixed; inset:0; z-index:9999;
    background:
      radial-gradient(ellipse at 50% 40%, #12151b 0%, #0a0c10 70%);
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.9s ease;
  }
  #intro-overlay.fade-out{ opacity:0; pointer-events:none; }

  .grid-bg{
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line-dim) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-dim) 1px, transparent 1px);
    background-size:40px 40px;
    opacity:0.05;
    animation:gridpan 30s linear infinite;
  }
  @keyframes gridpan{
    from{ background-position:0 0,0 0; }
    to{ background-position:400px 0, 0 400px; }
  }

  .intro-stage{
    position:relative;
    width:min(80vw,380px);
    aspect-ratio: 400/420;
    perspective:900px;
  }

  /* corner HUD brackets */
  .bracket{ position:absolute; width:22px; height:22px; border-color:var(--gold-dim); opacity:0.6; }
  .bracket.tl{ top:-14px; left:-14px; border-top:1.5px solid; border-left:1.5px solid; }
  .bracket.tr{ top:-14px; right:-14px; border-top:1.5px solid; border-right:1.5px solid; }
  .bracket.bl{ bottom:-14px; left:-14px; border-bottom:1.5px solid; border-left:1.5px solid; }
  .bracket.br{ bottom:-14px; right:-14px; border-bottom:1.5px solid; border-right:1.5px solid; }

  .hud-label{
    position:absolute; left:-10px; top:-34px;
    font-family:'Courier New',monospace; font-size:10px;
    letter-spacing:2px; color:var(--gold-dim);
    opacity:0; white-space:nowrap;
  }
  .hud-label.show{ animation:hudflicker 0.4s ease forwards; }
  @keyframes hudflicker{ 0%{opacity:0;} 40%{opacity:1;} 60%{opacity:0.3;} 100%{opacity:0.85;} }

  .hud-pct{
    position:absolute; right:-6px; bottom:-30px;
    font-family:'Courier New',monospace; font-size:11px;
    letter-spacing:1px; color:var(--gold-dim); opacity:0;
  }
  .hud-pct.show{ opacity:0.85; }

  #suit-svg{
    width:100%; height:100%; display:block;
    transform-style:preserve-3d;
    animation:spinIn 0.75s cubic-bezier(.22,.75,.32,1) both;
  }
  @keyframes spinIn{
    0%{ transform:rotateY(0deg) scale(.88); opacity:0; }
    55%{ opacity:1; }
    100%{ transform:rotateY(360deg) scale(1); opacity:1; }
  }

  .draw{
    fill:none;
    stroke:var(--line);
    stroke-width:2.1;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition:stroke-dashoffset 0.85s cubic-bezier(.4,0,.2,1), opacity 0.5s ease;
  }
  .draw.gold{ stroke:var(--gold); }
  .btn{
    fill:none; stroke:var(--line); stroke-width:1.4;
    opacity:0; transition:opacity 0.4s ease;
  }
  .btn.show{ opacity:0.9; }

  #hBarL, #hBarR{ transition:transform 0.8s cubic-bezier(.4,0,.2,1); }
  #hBarL.split{ transform:translateX(-96px); }
  #hBarR.split{ transform:translateX(96px); }
  #crossbar.hide{ opacity:0; }

  #text-reveal{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; pointer-events:none;
  }
  .reveal-text{
    opacity:0; transform:scale(0.82);
    transition:opacity 0.9s cubic-bezier(.2,.8,.2,1), transform 0.9s cubic-bezier(.2,.8,.2,1);
    color:#f2f2f2; font-family:Georgia,'Times New Roman',serif;
    letter-spacing:0.14em; font-size:clamp(18px,4.6vw,26px);
    text-align:center; white-space:nowrap;
  }
  .reveal-text.show{ opacity:1; transform:scale(1); }
  .reveal-text .big-h{
    color:var(--gold); font-size:1.55em; font-weight:700;
    letter-spacing:0;
  }
  .reveal-rule{
    width:0; height:1px; background:var(--gold-dim); margin-top:14px;
    transition:width 1s ease 0.15s;
  }
  .reveal-rule.show{ width:120px; }

  .skip-btn{
    position:absolute; bottom:18px; right:18px;
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:1px;
    color:var(--line-dim); background:none; border:1px solid var(--line-dim);
    padding:6px 12px; cursor:pointer; opacity:0; transition:opacity .5s ease, color .3s, border-color .3s;
    z-index:2;
  }
  .skip-btn.show{ opacity:0.7; }
  .skip-btn:hover{ color:var(--gold); border-color:var(--gold-dim); opacity:1; }

  /* ---------- SITE CONTENT (behind the intro) ---------- */
  #site-content{ background:var(--bg2); min-height:100vh; color:#e8e8e8; }
  header.site-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:28px 6vw; border-bottom:1px solid #1c2028;
  }
  .logo{ font-family:Georgia,serif; letter-spacing:0.12em; font-size:18px; }
  .logo .g{ color:var(--gold); }
  nav.links a{
    color:#c7cbd1; text-decoration:none; margin-left:32px; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase; opacity:0.85;
  }
  nav.links a:hover{ color:var(--gold); }
  .hero{
    max-width:720px; margin:14vh auto 0; padding:0 6vw; text-align:center;
  }
  .hero h1{
    font-family:Georgia,serif; font-weight:400; font-size:clamp(30px,5vw,50px);
    line-height:1.25; letter-spacing:0.02em; margin-bottom:22px;
  }
  .hero h1 span{ color:var(--gold); }
  .hero p{ color:#a7adb6; font-size:15px; line-height:1.7; margin-bottom:34px; }
  .cta{
    display:inline-block; padding:14px 34px; border:1px solid var(--gold);
    color:var(--gold); text-decoration:none; letter-spacing:0.1em; font-size:13px;
    text-transform:uppercase; transition:all .3s ease;
  }
  .cta:hover{ background:var(--gold); color:#0a0c10; }
</style>
</head>
<body class="lock">

<div id="intro-overlay">
  <div class="grid-bg"></div>

  <div class="intro-stage">
    <span class="bracket tl"></span><span class="bracket tr"></span>
    <span class="bracket bl"></span><span class="bracket br"></span>
    <span class="hud-label" id="hudLabel">RENDERIZANDO_SILHUETA</span>
    <span class="hud-pct" id="hudPct">00%</span>

    <svg id="suit-svg" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
      <!-- silhouette outline -->
      <path class="draw" id="outlineL" d="M160,58 L82,96 L64,378"/>
      <path class="draw" id="outlineR" d="M240,58 L318,96 L336,378"/>
      <path class="draw" id="hem" d="M64,378 L336,378"/>

      <!-- collar notches -->
      <path class="draw" id="collarL" d="M160,58 L200,42"/>
      <path class="draw" id="collarR" d="M240,58 L200,42"/>

      <!-- lapels (open blazer) -->
      <path class="draw" id="lapelL" d="M160,58 L192,298"/>
      <path class="draw" id="lapelR" d="M240,58 L208,298"/>

      <!-- tie -->
      <path class="draw gold" id="tieKnot" d="M188,74 L212,74 L200,98 Z"/>
      <path class="draw gold" id="tieStrap" d="M196,98 L190,286 L210,286 L204,98 Z"/>

      <!-- buttons -->
      <circle class="btn" id="btn1" cx="188" cy="318" r="4"/>
      <circle class="btn" id="btn2" cx="188" cy="344" r="4"/>

      <!-- H bars (born from the collar points) -->
      <path class="draw" id="hBarL" d="M160,58 L160,298"/>
      <path class="draw" id="hBarR" d="M240,58 L240,298"/>
      <path class="draw" id="crossbar" d="M160,178 L240,178"/>
    </svg>

    <div id="text-reveal">
      <div class="reveal-text" id="revealText"><span class="big-h">H</span>OMEM DE PRESEN&Ccedil;A</div>
      <div class="reveal-rule" id="revealRule"></div>
    </div>
  </div>

  <button class="skip-btn" id="skipBtn">PULAR ›</button>
</div>

<!-- ================= CONTEÚDO DO SITE ================= -->
<div id="site-content">
  <header class="site-nav">
    <div class="logo">HOMEM DE <span class="g">PRESEN&Ccedil;A</span></div>
    <nav class="links">
      <a href="#">Sobre</a>
      <a href="#">Estilo</a>
      <a href="#">Contato</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Presen&ccedil;a n&atilde;o &eacute; sorte.<br>&Eacute; <span>constru&ccedil;&atilde;o</span>.</h1>
    <p>Um guia direto sobre postura, estilo e atitude para o homem que quer ser lembrado
       antes mesmo de dizer uma palavra.</p>
    <a class="cta" href="#">Come&ccedil;ar</a>
  </section>
</div>

<script>
(function(){
  var timers = [];
  function schedule(fn, t){ timers.push(setTimeout(fn, t)); }

  function setupDraw(el){
    var len = el.getTotalLength ? el.getTotalLength() : 200;
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
  }
  function trigger(el){ el.style.strokeDashoffset = 0; }

  var drawEls = Array.prototype.slice.call(document.querySelectorAll('.draw'));
  drawEls.forEach(setupDraw);

  var outlineL=document.getElementById('outlineL'), outlineR=document.getElementById('outlineR'),
      hem=document.getElementById('hem'), collarL=document.getElementById('collarL'),
      collarR=document.getElementById('collarR'), lapelL=document.getElementById('lapelL'),
      lapelR=document.getElementById('lapelR'), tieKnot=document.getElementById('tieKnot'),
      tieStrap=document.getElementById('tieStrap'), btn1=document.getElementById('btn1'),
      btn2=document.getElementById('btn2'), hBarL=document.getElementById('hBarL'),
      hBarR=document.getElementById('hBarR'), crossbar=document.getElementById('crossbar'),
      hudLabel=document.getElementById('hudLabel'), hudPct=document.getElementById('hudPct'),
      revealText=document.getElementById('revealText'), revealRule=document.getElementById('revealRule'),
      overlay=document.getElementById('intro-overlay'), skipBtn=document.getElementById('skipBtn');

  var suitParts = [outlineL,outlineR,hem,collarL,collarR,lapelL,lapelR,tieKnot,tieStrap];

  // percentage counter
  var pctInterval = null;
  function startPct(totalMs){
    var start = Date.now();
    hudPct.classList.add('show');
    hudLabel.classList.add('show');
    pctInterval = setInterval(function(){
      var pct = Math.min(100, Math.round((Date.now()-start)/totalMs*100));
      hudPct.textContent = (pct<10?'0':'')+pct+'%';
      if(pct>=100) clearInterval(pctInterval);
    }, 40);
  }
  function stopPct(){ if(pctInterval) clearInterval(pctInterval); hudPct.textContent='100%'; }

  function fadeSuit(){
    suitParts.forEach(function(el){ el.style.opacity = 0; });
    btn1.classList.remove('show'); btn2.classList.remove('show');
    hudLabel.style.opacity = 0; hudPct.style.opacity = 0;
  }

  function drawH(){
    trigger(hBarL); trigger(hBarR);
    schedule(function(){ trigger(crossbar); }, 350);
  }

  function splitH(){
    hBarL.classList.add('split');
    hBarR.classList.add('split');
    crossbar.classList.add('hide');
  }

  function showText(){
    revealText.classList.add('show');
    schedule(function(){ revealRule.classList.add('show'); }, 100);
  }

  function fadeOutOverlay(){
    overlay.classList.add('fade-out');
    document.body.classList.remove('lock');
    setTimeout(function(){ overlay.style.display = 'none'; }, 950);
  }

  function skip(){
    timers.forEach(clearTimeout);
    if(pctInterval) clearInterval(pctInterval);
    fadeOutOverlay();
  }
  skipBtn.addEventListener('click', skip);

  // ---------------- TIMELINE ----------------
  schedule(function(){ trigger(outlineL); trigger(outlineR); }, 450);
  schedule(function(){ trigger(collarL); trigger(collarR); }, 600);
  schedule(function(){ trigger(hem); }, 650);
  schedule(function(){ trigger(lapelL); trigger(lapelR); }, 720);
  schedule(function(){ trigger(tieKnot); }, 880);
  schedule(function(){ trigger(tieStrap); }, 950);
  schedule(function(){ btn1.classList.add('show'); }, 1350);
  schedule(function(){ btn2.classList.add('show'); }, 1450);

  schedule(function(){ startPct(2250); }, 0);

  schedule(function(){ skipBtn.classList.add('show'); }, 900);

  schedule(function(){ fadeSuit(); stopPct(); }, 2300);
  schedule(function(){ drawH(); }, 2350);

  schedule(function(){ splitH(); }, 3800);
  schedule(function(){ showText(); }, 4000);

  schedule(function(){ fadeOutOverlay(); }, 5700);
})();
</script>
</body>
</html>
